<!DOCTYPE html>
<html>
<head>
    <title>Image Attribute Demo</title>
</head>
<body>

<!-- 1. Image without border -->
<center><b>Image without border</b></center><br>
<center>
    <img src="D:/walpaper/Marvels Spider-Man 2 Screenshot 2026.04.13 - 00.52.18.31.png" width="600" height="350">
</center>

<br><br>
<hr size="4" color="red">
<br>

<!-- 2. Image with border -->
<center><b>Image with border</b></center><br>
<center>
    <img src="D:/walpaper/the weeknd/wp7325287-the-weeknd-starboy-wallpapers.jpg" border="2" width="600" height="350">
</center>

<br><br>
<hr size="4" color="red">
<br>

<!-- 3. Image with width and height attributes -->
<center><b>Image with width and height attributes</b></center><br>
<center>
    <img src="D:/walpaper/the weeknd/wp15602204-the-weeknd-4k-pc-wallpapers.jpg" width="400" height="250">
</center>

<br><br>
<hr size="4" color="red">
<br>

<!-- 4. Image with align attribute (Separated with <br> to prevent overlapping) -->
<center><b>Image with align attribute</b></center><br>

<center>
    <img src="D:/walpaper/phool/lotus-flower-purple-5120x2880-25008.jpg" align="bottom" width="300" height="200">
    <i> Welcome </i>
</center>

<br><br>

<center>
    <img src="D:/walpaper/phool/hans-p8-wTxbKqu4-unsplash.jpg" align="middle" width="300" height="200">
    <i> welcome </i>
</center>

<br><br>
<hr size="4" color="red">
<br>

<!-- 5. Image with hspace and vspace attributes -->
<center><b>Image with hspace and vspace attributes</b></center><br>
<center>
    <img src="D:/walpaper/phool/arno-smit-sKJ7zSylUao-unsplash.jpg" hspace="50" vspace="50" width="400" height="250">
</center>

<br><br>
<hr size="4" color="red">
<br>

<!-- 6. Image with alt attribute -->
<center><b>Image with alt attribute</b></center><br>
<center>
    <img src="" alt="sunflowrs pic" hspace="50" vspace="50" width="400" height="250">
</center>

</body>
</html>
